<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05080a" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/img/icon-192.png" />
  <title>Wall of Battle</title>
  <style>
    /* touch-action: manipulation — žádný double-tap zoom ani 350ms zpoždění
       kliku (iOS tap-offset bugy při zoomu stránky rozbíjely tlačítka);
       text-size-adjust proti automatickému nafukování textu v Safari */
    html, body { margin: 0; padding: 0; height: 100%; background: #05080a; color: #9fd8a0; font-family: "Consolas", "Menlo", monospace; overflow: hidden; touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    #app { position: relative; height: 100vh; }
    #plot-container { position: absolute; inset: 0; }
    #plot { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #topbar { position: absolute; top: 0; left: 0; right: 0; padding: 4px 8px; font-size: 12px; pointer-events: none; z-index: 8; }
    #topbar > * { pointer-events: auto; }
    /* --- HUD vrstvy nad plotem (kontejnery nechytají klik, panely ano) --- */
    .hud { position: absolute; z-index: 6; display: flex; flex-direction: column; gap: 6px; pointer-events: none; font-size: 11px; }
    #hud-tl { top: 30px; left: 8px; width: 336px; bottom: 96px; overflow-y: auto; }
    #hud-tr { top: 30px; right: 8px; width: 340px; bottom: 96px; overflow-y: auto; }
    #hud-bottom { left: 8px; right: 364px; bottom: 8px; flex-direction: row; align-items: flex-end; }
    #hud-br { right: 8px; bottom: 8px; width: 340px; max-height: 46vh; overflow-y: auto; justify-content: flex-end; }
    /* sloupce jen jako fallback scrollují, panely samotné se nesmí roztahovat */
    .hud > * { flex-shrink: 0; }
    .panel { border: 1px solid #1c3a1e; padding: 4px 6px; background: #05080ac0; backdrop-filter: blur(2px); pointer-events: auto; }
    .panel h3 { margin: 0 0 3px 0; font-size: 11px; color: #d8b34f; text-transform: uppercase; cursor: pointer; user-select: none; }
    .panel h3:last-child { margin-bottom: 0; }
    .panel h3 .fold-mark { color: #6fae74; }
    #hud-bottom .panel { max-width: 100%; }
    /* rozklikávací detail třídy lodi */
    .cls-row { cursor: pointer; color: #6fae74; padding: 1px 0; user-select: none; }
    .cls-row:hover { color: #9fd8a0; }
    .cls-lore { color: #9fd8a0; font-size: 11px; line-height: 1.4; margin: 3px 0; border-left: 2px solid #1c3a1e; padding-left: 6px; }
    .cls-table { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 3px 0; font-size: 11px; }
    /* subsystémy ve dvou sloupcích (kompaktní vlastní loď) */
    .subsys-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; margin-top: 4px; }
    .subsys-grid .subsys .nm { flex: 0 0 72px; font-size: 10px; }
    .subsys-grid .subsys .pc { flex: 0 0 28px; font-size: 10px; }
    /* vodorovná lišta rozkazů */
    .ob { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
    .ob .obg { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 0 8px; border-left: 1px solid #1c3a1e; }
    .ob .obg:first-child { border-left: none; padding-left: 0; }
    .ob-cd { height: 3px; margin-top: 4px; background: #0b1a0c; border: 1px solid #1c3a1e; }
    .ob-cd i { display: block; height: 100%; background: #2a5a2e; }
    .ob-cd.amber i { background: #8a6a1f; }
    button { background: #0b1a0c; color: #9fd8a0; border: 1px solid #2a5a2e; font-family: inherit; font-size: 12px; cursor: pointer; padding: 2px 8px; }
    button:hover { background: #14301662; }
    button.active { background: #2a5a2e; color: #eaffea; }
    button:disabled { opacity: .35; cursor: default; }
    .warn { color: #e06c5a; }
    /* --- UI vrstva (CIC displej) --- */
    #topbar { display: flex; gap: 12px; align-items: center; background: linear-gradient(#05080ae0, #05080a00); }
    .tb-time { color: #eaffea; min-width: 110px; }
    .tb-comp button { margin-right: 2px; }
    /* --- audio ovládání (renderuje se jednou, mimo přerender topbaru) --- */
    .tb-main { display: inline-flex; gap: 12px; align-items: center; flex-wrap: nowrap; white-space: nowrap; min-width: 0; }
    .tb-slow { overflow: hidden; text-overflow: ellipsis; max-width: 42vw; }
    .tb-audio { display: inline-flex; gap: 8px; align-items: center; margin-left: auto; }
    .tb-audio label { display: inline-flex; gap: 3px; align-items: center; color: #6fae74; font-size: 11px; }
    .tb-audio input[type=range] { width: 64px; height: 12px; margin: 0; accent-color: #2a5a2e; }
    .tb-audio .tb-mute { min-width: 30px; }
    .tb-slow { color: #e0c05a; font-weight: bold; animation: blink .8s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .ok { color: #9fd8a0; } .amber { color: #d8b34f; } .bad { color: #e06c5a; } .dim { color: #5a7a5e; }
    .row { display: flex; justify-content: space-between; gap: 8px; }
    .subsys { display: flex; align-items: center; gap: 6px; line-height: 1.5; }
    .subsys .nm { flex: 0 0 108px; color: #6fae74; }
    .subsys .bar { flex: 1; height: 6px; background: #0b1a0c; border: 1px solid #1c3a1e; }
    .subsys .bar i { display: block; height: 100%; background: #2a5a2e; }
    .subsys.amber .bar i { background: #8a6a1f; }
    .subsys.bad .bar i { background: #7a2a1f; }
    .subsys .pc { flex: 0 0 34px; text-align: right; }
    .contact-row { cursor: pointer; padding: 2px 4px; border-bottom: 1px solid #0e2012; }
    .contact-row:hover { background: #14301662; }
    .contact-row.sel { background: #1c3a1e; color: #eaffea; }
    .fleet-row { cursor: pointer; padding: 2px 4px; border-bottom: 1px solid #0e2012; }
    .fleet-row:hover { background: #14301662; }
    .fleet-row.sel { background: #1c3a1e; color: #eaffea; }
    .fleet-row.dim { cursor: default; opacity: 0.6; }
    /* hromadný výběr: vybrané neaktivní lodě flotily */
    .fleet-row.msel { background: #12281a; }
    /* nouzový výkon 120 %: červené tlačítko */
    button.bad { color: #e06c5a; border-color: #7a2a1f; }
    button.bad.active { background: #7a2a1f; color: #ffd9d0; }
    .btnrow { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
    .obj { padding: 1px 0; }
    .obj.open { color: #d8b34f; } .obj.done { color: #9fd8a0; } .obj.failed { color: #e06c5a; }
    #log { max-height: 110px; overflow-y: auto; font-size: 10px; line-height: 1.4; color: #6fae74; }
    #log .ev-warn { color: #d8b34f; }
    .overlay { position: fixed; inset: 0; background: #05080aee; display: flex; align-items: center; justify-content: center; z-index: 30; font-size: 13px; }
    /* kinematické pozadí menu (flotila za soumraku) */
    /* stavba volné bitvy (skirmish) */
    .sk-grid { display: flex; gap: 16px; margin: 8px 0; flex-wrap: wrap; }
    .sk-col { flex: 1; min-width: 180px; border: 1px solid #1c3a24; padding: 8px 10px; }
    .sk-col-h { color: #d8b34f; letter-spacing: 1px; margin-bottom: 6px; font-size: 12px; }
    .sk-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    .sk-name { width: 34px; color: #9fd8a0; }
    .sk-n { width: 22px; text-align: center; font-weight: bold; }
    .sk-step { padding: 2px 10px; min-width: 32px; }
    .sk-total { margin-top: 6px; color: #6fae74; font-size: 12px; }
    .sk-opts { margin: 8px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sk-range.active { background: #1c4a24; color: #eaffea; }
    /* loadout (příprava mise) */
    .ld-row { margin: 12px 0 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ld-row > span { color: #d8b34f; letter-spacing: 1px; }
    .ld-btn.active { background: #1c4a24; color: #eaffea; }
    #menu-bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 20; display: none; }
    #menu-bg.on { display: block; }
    /* menu overlaye (úvod + výběr mise) prosvítí flotilu; briefing/výsledek zůstávají tmavé */
    .overlay.menu { background: radial-gradient(ellipse at 50% 40%, #05080a44 0%, #05080abb 100%); }
    .overlay.menu .box { background: #060d08e8; box-shadow: 0 0 60px #0f5a1450, 0 8px 40px #00000080; }
    .overlay .box { border: 1px solid #2a5a2e; background: #081008; padding: 20px 26px; max-width: min(620px, 94vw); max-height: 92vh; overflow-y: auto; box-shadow: 0 0 40px #0f5a1430; }
    /* dotyk: čitelnější overlaye bez nutnosti zoomovat stránku */
    @media (pointer: coarse) {
      .overlay { font-size: 15px; }
      .overlay .brief, .overlay .story { line-height: 1.5; }
    }
    /* --- skóre a žebříček --- */
    .score-block { border: 1px solid #2a5a2e; background: #081008; padding: 10px 12px; margin: 12px 0; }
    .score-total { color: #d8b34f; font-size: 16px; letter-spacing: 1px; margin-bottom: 6px; }
    .score-total b { color: #eaffea; }
    .score-block .row { font-size: 12px; color: #6fae74; }
    .lb-form { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .lb-form input[type=text], .lb-form input:not([type=checkbox]) {
      background: #0b1a0c; color: #9fd8a0; border: 1px solid #2a5a2e;
      font-family: inherit; font-size: 13px; padding: 6px 8px;
    }
    .lb-consent { font-size: 11px; color: #6fae74; display: flex; gap: 6px; align-items: center; }
    .lb-box { margin-top: 8px; font-size: 12px; }
    .lb-rank { color: #d8b34f; margin: 6px 0; }
    .lb-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12px; }
    .lb-table th { text-align: left; color: #d8b34f; border-bottom: 1px solid #2a5a2e; padding: 2px 6px; }
    .lb-table td { padding: 2px 6px; border-bottom: 1px solid #0e2012; color: #9fd8a0; }
    /* --- CRT overlay (fáze C): scanlines + vinětace, přepínač 📺 --- */
    #plot-container.crt::after {
      content: ''; position: absolute; inset: 0; z-index: 5; pointer-events: none;
      background: repeating-linear-gradient(
        0deg, transparent 0px, transparent 2px, #00000030 3px, transparent 4px);
      box-shadow: inset 0 0 140px 30px #000000a8;
    }
    /* banner chyby za běhu — ať je pád vidět a dá se nahlásit screenshotem */
    #errbar { position: fixed; left: 0; right: 0; top: 0; z-index: 99; background: #7a2a1f; color: #ffd9d0; font-size: 12px; padding: 6px 10px; display: none; white-space: pre-wrap; }
    .overlay h2 { color: #d8b34f; margin: 0 0 10px 0; letter-spacing: 2px; }
    .overlay h2.win { color: #58e06a; } .overlay h2.lose { color: #e06c5a; }
    .overlay .brief { white-space: pre-wrap; margin-bottom: 14px; color: #9fd8a0; }
    /* příběhové texty kampaně (prolog/epilog/intro) — odlišené kurzívou a barvou */
    .overlay .story { font-style: italic; color: #c9c2a0; border-left: 2px solid #8a6a1f; padding-left: 10px; max-height: 40vh; overflow-y: auto; }
    .overlay .story-epilog { margin-top: 12px; }
    .story-section { margin-bottom: 12px; }
    .story-section > button { display: block; width: 100%; text-align: left; color: #d8b34f; }
    .story-section .story { margin-top: 8px; font-size: 12px; }
    .overlay button { padding: 6px 22px; font-size: 13px; }
    .brief-img { width: 100%; max-height: 260px; object-fit: cover; border: 1px solid #2a5a2e; margin-bottom: 12px; display: block; }
    .brief-vid { width: 100%; max-height: 300px; object-fit: cover; border: 1px solid #2a5a2e; margin-bottom: 12px; display: block; background: #05080a; }
    .target-img { width: 100%; max-height: 110px; object-fit: cover; border: 1px solid #1c3a1e; margin: 4px 0; display: block; }
    .mission-row { margin-bottom: 10px; }
    .mission-row button { display: block; width: 100%; text-align: left; }
    .mission-desc { color: #6fae74; margin-top: 3px; font-size: 12px; }
    /* --- hvězdná mapa kampaně (star chart) --- */
    .overlay.menu-map .box { max-width: min(1000px, 96vw); }
    .sm-progress { color: #9fd8a0; font-size: 12px; margin-bottom: 8px; }
    .sm-progress b { color: #d8b34f; }
    .starmap { position: relative; width: 100%; margin-bottom: 12px; }
    .starmap-svg { display: block; width: 100%; height: auto; aspect-ratio: 1000 / 600;
      overflow: visible; border: 1px solid #17331c; border-radius: 4px;
      background: radial-gradient(ellipse 75% 70% at 50% 50%, #0b1526 0%, #070c16 55%, #02040a 100%); }
    /* spirální galaxie */
    .starmap-svg .neb { opacity: .14; filter: blur(34px); }
    .starmap-svg .gx-core { fill: url(#gxCore); filter: blur(10px); }
    .starmap-svg .gx-core2 { fill: #fff6e6; opacity: .5; filter: blur(8px); }
    /* hyperkoridory */
    .starmap-svg .lane { stroke-width: 2; fill: none; }
    .starmap-svg .lane.done { stroke: #3fae7a; stroke-opacity: .85;
      filter: drop-shadow(0 0 3px #2fae6a88); }
    .starmap-svg .lane.open { stroke: #4fd2e0; stroke-opacity: .8; stroke-dasharray: 7 6;
      filter: drop-shadow(0 0 3px #4fd2e088); animation: laneflow 1.2s linear infinite; }
    .starmap-svg .lane.locked { stroke: #35473a; stroke-opacity: .55; stroke-dasharray: 2 8; }
    .starmap-svg .lane.bonus { stroke: #d8a63f; stroke-dasharray: 4 7; }
    @keyframes laneflow { to { stroke-dashoffset: -13; } }
    /* soustavy */
    .starmap-svg .sys .hit { fill: transparent; }
    .starmap-svg .sys[data-mission] .hit { cursor: pointer; }
    .starmap-svg .sys .node { stroke-width: 2; }
    .starmap-svg .sys .glow { opacity: .18; }
    .starmap-svg .sys .badge { font-size: 13px; font-weight: 700; text-anchor: middle;
      dominant-baseline: central; pointer-events: none; }
    .starmap-svg .sys .title { font-size: 13px; fill: #7fa987; pointer-events: none; }
    .starmap-svg .sys.done .node { fill: #123020; stroke: #58e06a; }
    .starmap-svg .sys.done .glow { fill: #58e06a; }
    .starmap-svg .sys.done .badge { fill: #58e06a; }
    .starmap-svg .sys.done .title { fill: #6fae74; }
    .starmap-svg .sys.open .node { fill: #0b2a30; stroke: #5fe0ee;
      filter: drop-shadow(0 0 5px #4fd2e0); }
    .starmap-svg .sys.open .glow { fill: #4fd2e0; animation: syspulse 1.8s ease-in-out infinite; }
    .starmap-svg .sys.open .badge { fill: #bff2f8; }
    .starmap-svg .sys.open .title { fill: #a7dbe2; }
    .starmap-svg .sys.locked .node { fill: #0d160f; stroke: #35473a; }
    .starmap-svg .sys.locked .glow { fill: transparent; }
    .starmap-svg .sys.locked .badge { fill: #46603f; }
    .starmap-svg .sys.locked .title { fill: #3f5a45; }
    .starmap-svg .sys.bonus.open .node { stroke: #f0c14f; filter: drop-shadow(0 0 5px #d8a63f); }
    .starmap-svg .sys.bonus.open .glow { fill: #d8a63f; }
    .starmap-svg .sys.bonus.open .badge { fill: #ffe9a8; }
    .starmap-svg .sys.bonus .title { fill: #d8bd7f; }
    .starmap-svg .sys[data-mission] { cursor: pointer; }
    .starmap-svg .sys[data-mission]:hover .node { stroke-width: 3; }
    .starmap-svg .sys[data-mission]:hover .title { fill: #eaf6ec; }
    @keyframes syspulse { 0%,100% { opacity: .12; } 50% { opacity: .34; } }
    /* „jsi zde" */
    .starmap-svg .here { pointer-events: none; }
    .starmap-svg .here .pulse { fill: none; stroke: #d8b34f; stroke-width: 2;
      transform-box: fill-box; transform-origin: center;
      animation: herepulse 1.6s ease-out infinite; }
    .starmap-svg .here .ship { fill: #f2d97a; filter: drop-shadow(0 0 3px #d8b34f); }
    .starmap-svg .here .here-lbl { fill: #f2d97a; font-size: 12px; font-weight: 700;
      letter-spacing: 1px; }
    @keyframes herepulse { 0% { stroke-opacity: .8; r: 15px; } 100% { stroke-opacity: 0; r: 30px; } }
    .sm-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .sm-actions button { flex: 1 1 auto; }
    @media (max-width: 900px) { .sm-actions button { flex-basis: 45%; } }
    /* --- komunikace: avatary, panel, toasty --- */
    .comm-ava { position: relative; flex: 0 0 34px; width: 34px; height: 34px; border: 1px solid #2a5a2e; background: #0b1a0c; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; }
    .comm-ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .comm-ava i { display: none; font-style: normal; font-size: 10px; color: #d8b34f; }
    .comm-ava.noimg img { display: none; }
    .comm-ava.noimg i { display: block; }
    .comm-row { display: flex; gap: 6px; padding: 4px 0; border-bottom: 1px solid #0e2012; }
    .comm-body { flex: 1; min-width: 0; }
    .comm-name { color: #d8b34f; font-size: 11px; }
    .comm-text { color: #9fd8a0; font-size: 11px; line-height: 1.4; }
    #toasts { position: absolute; left: 12px; bottom: 96px; z-index: 10; display: flex; flex-direction: column; gap: 6px; max-width: 420px; pointer-events: none; }
    .toast { display: flex; gap: 8px; align-items: flex-start; border: 1px solid #2a5a2e; background: #081008ee; padding: 6px 10px; font-size: 12px; box-shadow: 0 0 18px #0f5a1430; transition: opacity .5s; }
    .toast.fade { opacity: 0; }
    .toast-comm { border-color: #8a6a1f; }
    .toast-comm .toast-body { display: flex; flex-direction: column; gap: 2px; }
    .toast-comm b { color: #d8b34f; }
    .toast-hit { border-color: #7a2a1f; color: #e06c5a; }
    .toast-hit b { color: #ff8a75; letter-spacing: 1px; }
    .auto-fire { border-top: 1px dotted #2a5a2e; margin-top: 3px; padding-top: 3px; }
    /* --- nápověda --- */
    .help-box { max-width: 720px; max-height: 84vh; overflow-y: auto; }
    .help-box h4 { color: #d8b34f; margin: 12px 0 4px 0; }
    .help-grid { display: grid; grid-template-columns: 130px 1fr; gap: 2px 10px; font-size: 12px; }
    .help-grid b { color: #9fd8a0; }
    .help-grid span { color: #6fae74; }

    /* ---------- MOBIL A TABLET ---------- */
    /* krátké popisky tlačítek — jen na telefonu (viz níže) */
    .lbl-sm { display: none; }
    /* výsuvné záložky HUD sloupců — mimo telefonní breakpoint skryté */
    .hud-tab { display: none; }
    /* výzva k otočení na šířku — jen dotyk v portrétu */
    #rotate-hint { display: none; }

    /* dotyková zařízení: větší cíle (min. ~40 px), víc vzduchu */
    @media (pointer: coarse) {
      button { min-height: 38px; padding: 6px 12px; font-size: 14px; }
      .ob { gap: 6px; }
      .ob .obg { gap: 6px; }
      .hud { font-size: 12px; }
      .panel { padding: 6px 8px; }
      .panel h3 { font-size: 13px; padding: 4px 0; }
      .contact-row, .fleet-row { padding: 8px 6px; }
      .cls-row { padding: 6px 0; }
      .tb-audio input[type=range] { width: 90px; height: 28px; }
      .overlay button { min-height: 44px; }
      #topbar { font-size: 14px; }
      .tb-comp button { min-width: 44px; }
    }

    /* Kompaktní mobilní vrstva (HUD sloupce jako výsuvné šuplíky, krátké
       popisky, skrytý komunikační sloupec). Řídí ji JEDNA třída body.phone,
       kterou nastavuje JS (main.ts): úzký viewport (≤ 900 px), telefon dle
       pointer:coarse, nebo ruční přepínač 🖐. Jeden zdroj pravdy pro layout,
       ať platí i nad 900 px — proto ne @media, ale třída. */
    body.phone .tb-mobile { color: #d8b34f; }  /* zvýraznění vždy sleduje stav třídy */
    /* kompaktní topbar: bez posuvníků hlasitosti, bez mezistupňů komprese
       a bez textu zpomalení — nic nesmí přetéct do druhé řady */
    body.phone #topbar { flex-wrap: nowrap; overflow: hidden; gap: 6px; padding-top: calc(4px + env(safe-area-inset-top)); }
    body.phone .tb-main { flex-wrap: nowrap; min-width: 0; overflow: hidden; }
    body.phone .tb-time { min-width: 0; }
    body.phone .tb-cb-10, body.phone .tb-cb-1000 { display: none; }
    body.phone .tb-audio label { display: none; }
    body.phone .tb-audio { gap: 4px; }
    body.phone .tb-slow { display: none; max-width: 30vw; }
    body.phone #hud-tl, body.phone #hud-tr {
      top: 60px; bottom: 96px; width: min(340px, 86vw);
      background: #05080af2; z-index: 12; transition: transform .2s ease; padding: 6px;
    }
    body.phone #hud-tl { left: 0; transform: translateX(-100%); border-right: 1px solid #1c3a1e; }
    body.phone #hud-tr { right: 0; transform: translateX(100%); border-left: 1px solid #1c3a1e; }
    body.phone #hud-tl.open, body.phone #hud-tr.open { transform: translateX(0); }
    body.phone .hud-tab {
      display: block; position: absolute; z-index: 13; top: 64px;
      min-width: 44px; min-height: 52px; font-size: 16px;
      background: #081008ee; border: 1px solid #2a5a2e; color: #9fd8a0;
    }
    body.phone #tab-tl { left: 0; border-left: none; }
    body.phone #tab-tr { right: 0; border-right: none; }
    /* bojové menu: KRÁTKÉ popisky + zalomení do řad — celé viditelné */
    body.phone .lbl-lg { display: none; }
    body.phone .lbl-sm { display: inline; }
    body.phone #hud-bottom { left: 0; right: 0; bottom: 0; padding: 2px calc(2px + env(safe-area-inset-right)) calc(2px + env(safe-area-inset-bottom)) calc(2px + env(safe-area-inset-left)); }
    body.phone #hud-bottom .panel { width: 100%; box-sizing: border-box; }
    body.phone #hud-bottom button { min-height: 34px; padding: 4px 8px; font-size: 13px; }
    body.phone #hud-bottom .panel h3 { display: none; } /* hlavička „Rozkazy" jen bere místo */
    body.phone .ob { flex-wrap: wrap; row-gap: 4px; }
    body.phone .ob .obg { padding: 0 4px; }
    body.phone #hud-br { display: none; } /* komunikaci nesou toasty, log netřeba */
    body.phone #toasts { bottom: 100px; max-width: 86vw; }

    /* M1: stavový prstenec vlastní lodi (mobil) — infografika místo textu.
       Zobrazuje ho jen MobileHud na body.phone; palcová zóna vlevo dole. */
    #mobile-hud { position: absolute; left: 8px; bottom: 92px; z-index: 11;
      width: 120px; pointer-events: none; display: none; text-align: center; }
    #mobile-hud svg { width: 120px; height: 120px; display: block;
      filter: drop-shadow(0 0 6px #05080acc); }
    #mobile-hud .mh-bg { fill: #060d0ae0; stroke: #1c3a1e; stroke-width: 1; }
    #mobile-hud .mh-thr { fill: none; stroke: #4fd2e0; stroke-width: 5;
      stroke-linecap: round; opacity: .8; }
    #mobile-hud .mh-hull { fill: none; stroke-width: 5; stroke-linecap: round; }
    #mobile-hud .mh-hullpct { font: 700 22px system-ui, sans-serif; text-anchor: middle; }
    #mobile-hud .mh-lbl { fill: #6fae74; font: 8px system-ui, sans-serif;
      text-anchor: middle; letter-spacing: 1px; }
    #mobile-hud .mh-ic { font-size: 12px; text-anchor: middle; }
    #mobile-hud .mh-ic.on { fill: #58e06a; }
    #mobile-hud .mh-ic.off { fill: #46603f; }
    #mobile-hud .mh-ic.warn { fill: #e0c24a; }
    #mobile-hud .mh-name { color: #9fd8a0; font-size: 11px; margin-top: -4px;
      text-shadow: 0 0 4px #05080a; white-space: nowrap; }

    /* M2: palcový proužek kontaktů (mobil) — nejbližší cíle trvale na dosah
       palce u pravého okraje, nad lištou rozkazů. Klepnutí zaměří (data-sel),
       podržení otevře šuplík s detailem. Jen na body.phone. */
    #mobile-contacts { display: none; }
    /* mezi pravou záložkou (◨, top 64–116px) a lištou rozkazů — vždy bez
       překryvu, přebytek čipů se roluje uvnitř proužku */
    body.phone #mobile-contacts { position: absolute; right: 6px; top: 122px;
      bottom: 96px; z-index: 11; width: 76px; overflow-y: auto;
      display: none; flex-direction: column; gap: 5px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    body.phone #mobile-contacts::-webkit-scrollbar { display: none; }
    .mc-chip { box-sizing: border-box; background: #060d0ae8; border: 1px solid #1c3a1e;
      border-left-width: 3px; border-radius: 5px; padding: 4px 5px; cursor: pointer;
      box-shadow: 0 0 6px #05080aaa; user-select: none; }
    .mc-chip .mc-top { display: flex; align-items: center; gap: 3px; line-height: 1.1; }
    .mc-chip .mc-mark { font-size: 11px; }
    .mc-chip .mc-code { flex: 1; font: 700 13px system-ui, sans-serif; color: #eaffea; }
    .mc-chip .mc-arr { font-size: 10px; opacity: .8; }
    .mc-chip .mc-rng { font-size: 11px; color: #9fd8a0; white-space: nowrap; }
    .mc-chip .mc-pips { display: flex; gap: 3px; margin-top: 3px; }
    .mc-chip .mc-pips i { width: 5px; height: 5px; border-radius: 50%;
      border: 1px solid #46603f; }
    .mc-chip .mc-pips i.on { background: #58e06a; border-color: #58e06a; }
    /* barva levého okraje + značky podle blízkosti cíle */
    .mc-chip.mc-t-closing { border-left-color: #e06c5a; }
    .mc-chip.mc-t-closing .mc-mark, .mc-chip.mc-t-closing .mc-arr { color: #e06c5a; }
    .mc-chip.mc-t-holding { border-left-color: #e0c24a; }
    .mc-chip.mc-t-holding .mc-mark, .mc-chip.mc-t-holding .mc-arr { color: #e0c24a; }
    .mc-chip.mc-t-opening { border-left-color: #46603f; }
    .mc-chip.mc-t-opening .mc-mark, .mc-chip.mc-t-opening .mc-arr { color: #6fae74; }
    .mc-chip.mc-surr { border-left-color: #4f8fe0; }
    .mc-chip.mc-surr .mc-mark { color: #4f8fe0; }
    .mc-chip.mc-surr .mc-code { color: #9fbfe0; }
    .mc-chip.sel { background: #1c3a1e; border-color: #58e06a; box-shadow: 0 0 8px #2c5a2e; }

    /* M3: palcové radiální kolo rozkazů (mobil). FAB v pravém dolním rohu
       (vyhrazený okap v liště rozkazů), po klepnutí se z něj vysune oblouk
       6 jádrových bojových akcí (salva/plošiny/energie/kurz/klín/senzory).
       Akce míří na data-act — stejnou delegaci Panels jako lišta. */
    #mobile-wheel { display: none; }
    body.phone #mobile-wheel { display: block; }
    /* okap pro FAB, ať pod ním nemizí tlačítka lišty rozkazů */
    body.phone #hud-bottom { padding-right: calc(64px + env(safe-area-inset-right)); }
    .mw-fab { position: absolute; right: calc(8px + env(safe-area-inset-right)); bottom: calc(8px + env(safe-area-inset-bottom));
      z-index: 14; width: 52px; height: 52px; border-radius: 50%; font-size: 22px;
      background: #0b1a0cf2; border: 2px solid #2a5a2e; color: #9fd8a0;
      box-shadow: 0 0 10px #05080a; display: flex; align-items: center; justify-content: center; }
    #mobile-wheel.open .mw-fab { border-color: #58e06a; color: #eaffea; }
    .mw-scrim { position: absolute; inset: 0; z-index: 12; display: none; background: #05080a00; }
    #mobile-wheel.open .mw-scrim { display: block; background: #05080a6e; }
    .mw-arc { position: absolute; right: calc(34px + env(safe-area-inset-right)); bottom: calc(34px + env(safe-area-inset-bottom)); z-index: 13; width: 0; height: 0; }
    .mw-act { position: absolute; left: -28px; top: -28px; width: 56px; height: 56px;
      border-radius: 50%; transform: translate(0, 0); opacity: 0; pointer-events: none;
      transition: transform .16s ease, opacity .16s ease;
      background: #0b1a0cf5; border: 1px solid #2a5a2e; color: #cfeecf;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      box-shadow: 0 0 8px #05080a; }
    #mobile-wheel.open .mw-act { transform: translate(var(--tx), var(--ty)); opacity: 1; pointer-events: auto; }
    .mw-act .mw-g { font-size: 20px; line-height: 1; }
    .mw-act .mw-l { font-size: 8px; letter-spacing: .3px; text-align: center; max-width: 52px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mw-act.active { border-color: #58e06a; color: #eaffea; box-shadow: 0 0 8px #2c5a2e; }
    #mobile-wheel.open .mw-act:disabled { opacity: .3; pointer-events: none; }
    body.mw-open #mobile-contacts { visibility: hidden; }

    /* ---------- iPad / tablet (body.tablet, viz main.ts) ----------
       Hrubý pointer + velký displej. Drží bohatší rozvržení než telefon
       (na šířku plné desktop panely, na výšku kompaktní vrstvu) a jen zvětší
       dotykové cíle + písmo na pohodlnou velikost pro prst. Ortogonální k
       body.phone: iPad na šířku = tablet (ne phone), na výšku = tablet+phone. */
    body.tablet .hud { font-size: 13px; }
    body.tablet .panel h3 { font-size: 13px; }
    body.tablet button { min-height: 40px; font-size: 14px; padding: 5px 10px; }
    body.tablet .tb-cb { min-width: 40px; }
    body.tablet .contact-row, body.tablet .fleet-row { padding: 10px 8px; }
    body.tablet .hud-tab { min-width: 54px; min-height: 62px; font-size: 20px; }
    body.tablet .mc-chip { padding: 6px 7px; }

    /* iPad na šířku: desktop rozvržení (panely trvale vidět), ovládání palcem.
       Šířky panelů necháváme, aby plot zůstal dost široký i na 9,7". */
    body.tablet:not(.phone) #topbar { font-size: 14px; }
    body.tablet:not(.phone) #hud-bottom button { min-height: 44px; padding: 7px 12px; }
    body.tablet:not(.phone) #log { max-height: 150px; font-size: 12px; }

    /* iPad na výšku: kompaktní vrstva, ale využij velký displej — větší prstenec,
       širší proužek kontaktů, palcová lišta rozkazů. */
    body.tablet.phone #hud-bottom button { min-height: 46px; font-size: 15px; }
    body.tablet.phone #mobile-hud { width: 148px; bottom: 104px; }
    body.tablet.phone #mobile-hud svg { width: 148px; height: 148px; }
    body.tablet.phone #mobile-contacts { width: 94px; top: 140px; bottom: 108px; }
    body.tablet.phone .mc-chip .mc-code { font-size: 15px; }
    body.tablet.phone .mc-chip .mc-rng { font-size: 13px; }
    body.tablet.phone .mw-fab { width: 62px; height: 62px; font-size: 26px; }
    body.tablet.phone .mw-act { width: 64px; height: 64px; left: -32px; top: -32px; }
    body.tablet.phone .mw-act .mw-g { font-size: 23px; }
    body.tablet.phone .mw-act .mw-l { font-size: 9px; max-width: 60px; }

    /* portrét na dotyku: taktický plot potřebuje šířku — vyzvi k otočení.
       Práh 1100 px pokryje i iPad Pro 12,9" na výšku (1024 px), aby i velké
       tablety hrály v ideální orientaci na šířku (manifest: landscape). */
    @media (orientation: portrait) and (pointer: coarse) and (max-width: 1100px) {
      #rotate-hint {
        display: flex; position: fixed; inset: 0; z-index: 40;
        background: #05080af8; align-items: center; justify-content: center;
        text-align: center; font-size: 16px; line-height: 1.6; padding: 24px;
      }
    }
  </style>
</head>
<body>
  <canvas id="menu-bg"></canvas>
  <div id="app">
    <div id="plot-container">
      <canvas id="plot"></canvas>
      <div id="topbar"></div>
      <div id="hud-tl" class="hud"></div>
      <div id="hud-tr" class="hud"></div>
      <div id="hud-bottom" class="hud"></div>
      <div id="hud-br" class="hud"></div>
      <button id="tab-tl" class="hud-tab" title="loď a flotila">◧</button>
      <button id="tab-tr" class="hud-tab" title="kontakty a cíle">◨</button>
    </div>
  </div>
  <div id="rotate-hint">OTOČTE ZAŘÍZENÍ NA ŠÍŘKU<br>taktický displej potřebuje širokou obrazovku</div>
  <div id="errbar"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
