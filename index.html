<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wall of Battle</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #05080a; color: #9fd8a0; font-family: "Consolas", "Menlo", monospace; overflow: hidden; }
    #app { position: relative; height: 100vh; }
    #plot-container { position: absolute; inset: 0; }
    #plot { position: absolute; inset: 0; width: 100%; height: 100%; }
    #topbar { position: absolute; top: 0; left: 0; right: 0; padding: 4px 8px; font-size: 12px; pointer-events: none; z-index: 8; }
    #topbar > * { pointer-events: auto; }
    /* --- HUD vrstvy nad plotem (kontejnery nechytají klik, panely ano) --- */
    .hud { position: absolute; z-index: 6; display: flex; flex-direction: column; gap: 6px; pointer-events: none; font-size: 11px; }
    #hud-tl { top: 30px; left: 8px; width: 336px; bottom: 96px; overflow-y: auto; }
    #hud-tr { top: 30px; right: 8px; width: 340px; bottom: 96px; overflow-y: auto; }
    #hud-bottom { left: 8px; right: 364px; bottom: 8px; flex-direction: row; align-items: flex-end; }
    #hud-br { right: 8px; bottom: 8px; width: 340px; max-height: 46vh; overflow-y: auto; justify-content: flex-end; }
    /* sloupce jen jako fallback scrollují, panely samotné se nesmí roztahovat */
    .hud > * { flex-shrink: 0; }
    .panel { border: 1px solid #1c3a1e; padding: 4px 6px; background: #05080ac0; backdrop-filter: blur(2px); pointer-events: auto; }
    .panel h3 { margin: 0 0 3px 0; font-size: 11px; color: #d8b34f; text-transform: uppercase; cursor: pointer; user-select: none; }
    .panel h3:last-child { margin-bottom: 0; }
    .panel h3 .fold-mark { color: #6fae74; }
    #hud-bottom .panel { max-width: 100%; }
    /* rozklikávací detail třídy lodi */
    .cls-row { cursor: pointer; color: #6fae74; padding: 1px 0; user-select: none; }
    .cls-row:hover { color: #9fd8a0; }
    .cls-lore { color: #9fd8a0; font-size: 11px; line-height: 1.4; margin: 3px 0; border-left: 2px solid #1c3a1e; padding-left: 6px; }
    .cls-table { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 3px 0; font-size: 11px; }
    /* subsystémy ve dvou sloupcích (kompaktní vlastní loď) */
    .subsys-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; margin-top: 4px; }
    .subsys-grid .subsys .nm { flex: 0 0 72px; font-size: 10px; }
    .subsys-grid .subsys .pc { flex: 0 0 28px; font-size: 10px; }
    /* vodorovná lišta rozkazů */
    .ob { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
    .ob .obg { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 0 8px; border-left: 1px solid #1c3a1e; }
    .ob .obg:first-child { border-left: none; padding-left: 0; }
    .ob-cd { height: 3px; margin-top: 4px; background: #0b1a0c; border: 1px solid #1c3a1e; }
    .ob-cd i { display: block; height: 100%; background: #2a5a2e; }
    .ob-cd.amber i { background: #8a6a1f; }
    button { background: #0b1a0c; color: #9fd8a0; border: 1px solid #2a5a2e; font-family: inherit; font-size: 12px; cursor: pointer; padding: 2px 8px; }
    button:hover { background: #14301662; }
    button.active { background: #2a5a2e; color: #eaffea; }
    button:disabled { opacity: .35; cursor: default; }
    .warn { color: #e06c5a; }
    /* --- UI vrstva (CIC displej) --- */
    #topbar { display: flex; gap: 12px; align-items: center; background: linear-gradient(#05080ae0, #05080a00); }
    .tb-time { color: #eaffea; min-width: 110px; }
    .tb-comp button { margin-right: 2px; }
    /* --- audio ovládání (renderuje se jednou, mimo přerender topbaru) --- */
    .tb-main { display: inline-flex; gap: 12px; align-items: center; flex-wrap: nowrap; white-space: nowrap; min-width: 0; }
    .tb-slow { overflow: hidden; text-overflow: ellipsis; max-width: 42vw; }
    .tb-audio { display: inline-flex; gap: 8px; align-items: center; margin-left: auto; }
    .tb-audio label { display: inline-flex; gap: 3px; align-items: center; color: #6fae74; font-size: 11px; }
    .tb-audio input[type=range] { width: 64px; height: 12px; margin: 0; accent-color: #2a5a2e; }
    .tb-audio .tb-mute { min-width: 30px; }
    .tb-slow { color: #e0c05a; font-weight: bold; animation: blink .8s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .ok { color: #9fd8a0; } .amber { color: #d8b34f; } .bad { color: #e06c5a; } .dim { color: #5a7a5e; }
    .row { display: flex; justify-content: space-between; gap: 8px; }
    .subsys { display: flex; align-items: center; gap: 6px; line-height: 1.5; }
    .subsys .nm { flex: 0 0 108px; color: #6fae74; }
    .subsys .bar { flex: 1; height: 6px; background: #0b1a0c; border: 1px solid #1c3a1e; }
    .subsys .bar i { display: block; height: 100%; background: #2a5a2e; }
    .subsys.amber .bar i { background: #8a6a1f; }
    .subsys.bad .bar i { background: #7a2a1f; }
    .subsys .pc { flex: 0 0 34px; text-align: right; }
    .contact-row { cursor: pointer; padding: 2px 4px; border-bottom: 1px solid #0e2012; }
    .contact-row:hover { background: #14301662; }
    .contact-row.sel { background: #1c3a1e; color: #eaffea; }
    .fleet-row { cursor: pointer; padding: 2px 4px; border-bottom: 1px solid #0e2012; }
    .fleet-row:hover { background: #14301662; }
    .fleet-row.sel { background: #1c3a1e; color: #eaffea; }
    .fleet-row.dim { cursor: default; opacity: 0.6; }
    .btnrow { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
    .obj { padding: 1px 0; }
    .obj.open { color: #d8b34f; } .obj.done { color: #9fd8a0; } .obj.failed { color: #e06c5a; }
    #log { max-height: 110px; overflow-y: auto; font-size: 10px; line-height: 1.4; color: #6fae74; }
    #log .ev-warn { color: #d8b34f; }
    .overlay { position: fixed; inset: 0; background: #05080aee; display: flex; align-items: center; justify-content: center; z-index: 30; font-size: 13px; }
    .overlay .box { border: 1px solid #2a5a2e; background: #081008; padding: 20px 26px; max-width: 620px; max-height: 92vh; overflow-y: auto; box-shadow: 0 0 40px #0f5a1430; }
    .overlay h2 { color: #d8b34f; margin: 0 0 10px 0; letter-spacing: 2px; }
    .overlay h2.win { color: #58e06a; } .overlay h2.lose { color: #e06c5a; }
    .overlay .brief { white-space: pre-wrap; margin-bottom: 14px; color: #9fd8a0; }
    /* příběhové texty kampaně (prolog/epilog/intro) — odlišené kurzívou a barvou */
    .overlay .story { font-style: italic; color: #c9c2a0; border-left: 2px solid #8a6a1f; padding-left: 10px; max-height: 40vh; overflow-y: auto; }
    .overlay .story-epilog { margin-top: 12px; }
    .story-section { margin-bottom: 12px; }
    .story-section > button { display: block; width: 100%; text-align: left; color: #d8b34f; }
    .story-section .story { margin-top: 8px; font-size: 12px; }
    .overlay button { padding: 6px 22px; font-size: 13px; }
    .brief-img { width: 100%; max-height: 260px; object-fit: cover; border: 1px solid #2a5a2e; margin-bottom: 12px; display: block; }
    .target-img { width: 100%; max-height: 110px; object-fit: cover; border: 1px solid #1c3a1e; margin: 4px 0; display: block; }
    .mission-row { margin-bottom: 10px; }
    .mission-row button { display: block; width: 100%; text-align: left; }
    .mission-desc { color: #6fae74; margin-top: 3px; font-size: 12px; }
    /* --- komunikace: avatary, panel, toasty --- */
    .comm-ava { position: relative; flex: 0 0 34px; width: 34px; height: 34px; border: 1px solid #2a5a2e; background: #0b1a0c; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; }
    .comm-ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .comm-ava i { display: none; font-style: normal; font-size: 10px; color: #d8b34f; }
    .comm-ava.noimg img { display: none; }
    .comm-ava.noimg i { display: block; }
    .comm-row { display: flex; gap: 6px; padding: 4px 0; border-bottom: 1px solid #0e2012; }
    .comm-body { flex: 1; min-width: 0; }
    .comm-name { color: #d8b34f; font-size: 11px; }
    .comm-text { color: #9fd8a0; font-size: 11px; line-height: 1.4; }
    #toasts { position: absolute; left: 12px; bottom: 96px; z-index: 10; display: flex; flex-direction: column; gap: 6px; max-width: 420px; pointer-events: none; }
    .toast { display: flex; gap: 8px; align-items: flex-start; border: 1px solid #2a5a2e; background: #081008ee; padding: 6px 10px; font-size: 12px; box-shadow: 0 0 18px #0f5a1430; transition: opacity .5s; }
    .toast.fade { opacity: 0; }
    .toast-comm { border-color: #8a6a1f; }
    .toast-comm .toast-body { display: flex; flex-direction: column; gap: 2px; }
    .toast-comm b { color: #d8b34f; }
    .toast-hit { border-color: #7a2a1f; color: #e06c5a; }
    .toast-hit b { color: #ff8a75; letter-spacing: 1px; }
    .auto-fire { border-top: 1px dotted #2a5a2e; margin-top: 3px; padding-top: 3px; }
    /* --- nápověda --- */
    .help-box { max-width: 720px; max-height: 84vh; overflow-y: auto; }
    .help-box h4 { color: #d8b34f; margin: 12px 0 4px 0; }
    .help-grid { display: grid; grid-template-columns: 130px 1fr; gap: 2px 10px; font-size: 12px; }
    .help-grid b { color: #9fd8a0; }
    .help-grid span { color: #6fae74; }
  </style>
</head>
<body>
  <div id="app">
    <div id="plot-container">
      <canvas id="plot"></canvas>
      <div id="topbar"></div>
      <div id="hud-tl" class="hud"></div>
      <div id="hud-tr" class="hud"></div>
      <div id="hud-bottom" class="hud"></div>
      <div id="hud-br" class="hud"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
